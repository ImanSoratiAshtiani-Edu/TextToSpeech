name: kaspar-tts-demo
services:
  tts:
    build: .
    image: kaspar-tts-demo:local
    ipc: host
    ports:
      - "127.0.0.1:${TTS_PORT:-8091}:8000"
    volumes:
      - type: volume
        source: hf-cache
        target: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enforce-eager
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
volumes:
  hf-cache:
    name: ${HF_CACHE_VOLUME:-kaspar-tts-demo-hf-cache}
